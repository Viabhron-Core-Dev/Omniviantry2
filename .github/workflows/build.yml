name: Android CI & Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Pre-Build Credential Immunity Scan
      run: |
        echo "=== Scanning for committed credentials & keystores ==="
        EXPOSED_KEYS=$(find . -maxdepth 4 -name "*.keystore" -o -name "*.jks" -o -name "*.p12" -o -name ".env" | grep -v "\.env\.example" || true)
        if [ -n "$EXPOSED_KEYS" ]; then
          echo "::error::Committed credentials or keystores detected in repository:"
          echo "$EXPOSED_KEYS"
          exit 1
        fi
        echo "Security Scan Passed: Zero committed credentials detected."

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    - name: Generate Ephemeral Debug Keystore (CI Runtime Only)
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Run Unit Tests
      run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --no-configuration-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
